<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: url('biblioteca.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            width: 320px;
            text-align: center;
            color: white;
            position: relative;
        }

        h2 { margin-bottom: 30px; letter-spacing: 2px; }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            outline: none;
            font-size: 16px;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.7); }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background: #915910;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #642a03; transform: scale(1.02); }

        .footer-text {
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-text a {
            color: #00a8ff;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>INGRESO</h2>
    <form id="loginForm">
        <div class="input-group">
            <input type="text" id="nombre" placeholder="Nombre" required>
        </div>
        <div class="input-group">
            <input type="email" id="correo" placeholder="Email" required>
        </div>
        <div class="input-group">
            <input type="tel" id="telefono" placeholder="Numero de Telefono" required>
        </div>
        
        <button type="submit">IR A BIBLIOTECA</button>
        

    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Guardamos el nombre que escribió el usuario
    const nombreUsuario = document.getElementById('nombre').value;
    localStorage.setItem('usuarioActivo', nombreUsuario); 

    // Redirigimos
    window.location.href = "biblioteca.html"; 
});
</script>

</body>
</html>
